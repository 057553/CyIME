name: CJIME fuzzylock (arm64, auto follow)

# 跟随 onlyjco/CJIME（CyIME 的下游 fork，包名 com.onlyjco.cjime）：
# main 分支有新 commit 就用同一补丁重建 arm64 包并发 release。
# 同一 commit 已发过就跳过（想重建就勾 force）。
on:
  schedule:
    - cron: '20 20 * * *'          # UTC 20:20 = 北京 04:20
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'onlyjco/CJIME 的 ref（留空=main HEAD）'
        required: false
        default: ''
      force:
        description: '该 commit 已发过也强制重建'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cjime-fuzzylock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream commit
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF='${{ inputs.upstream_ref }}'
          if [ -z "$REF" ]; then
            REF=$(git ls-remote https://github.com/onlyjco/CJIME.git HEAD | awk '{print $1}')
          else
            REF=$(git ls-remote https://github.com/onlyjco/CJIME.git "$REF" | awk '{print $1}' | head -1)
          fi
          if [ -z "$REF" ]; then
            echo "::error::没能确定 onlyjco/CJIME 的 commit"
            exit 1
          fi
          SHA8=$(echo "$REF" | cut -c1-8)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha8=$SHA8" >> "$GITHUB_OUTPUT"
          echo "release_tag=cjime-${SHA8}-fuzzylock" >> "$GITHUB_OUTPUT"
          echo "上游 commit = $REF (${SHA8})"

      - name: Skip if already released
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "force=true，继续构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过（要重建请勾 force）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout patch source
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: patchsrc
          sparse-checkout: |
            .github/eta
          sparse-checkout-cone-mode: false

      - name: Checkout CJIME
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: onlyjco/CJIME
          ref: ${{ steps.ver.outputs.ref }}
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Apply fuzzy-lock patch (required)
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          P=../patchsrc/.github/eta/fuzzylock.patch
          echo "=== 补丁内容 ==="
          cat "$P"
          echo "=== 应用 ==="
          if ! git apply --check -p1 "$P"; then
            echo "::error::fuzzylock.patch 无法应用：CJIME 很可能改动了 pinyin_syllable_selection.h，需要人工 rebase 补丁。"
            sed -n '240,300p' app/src/main/jni/librime-t9/src/pinyin_syllable_selection.h || true
            exit 1
          fi
          git apply -p1 "$P"
          echo "=== 应用后 ==="
          sed -n '260,300p' app/src/main/jni/librime-t9/src/pinyin_syllable_selection.h

      - name: Apply arm64-only patch (best effort)
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -uo pipefail
          P=../patchsrc/.github/eta/arm64-only.patch
          if git apply --check -p1 "$P" 2>/dev/null; then
            git apply -p1 "$P"
            echo "已应用：只构建 arm64-v8a"
          else
            echo "::warning::arm64-only.patch 不适用（CJIME 可能改了 splits 配置），继续构建全架构，产物仍只上传 arm64"
          fi

      - name: Apply onnx-headers patch (best effort)
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -uo pipefail
          P=../patchsrc/.github/eta/onnx-headers-from-aar.patch
          if git apply --check -p1 "$P" 2>/dev/null; then
            git apply -p1 "$P"
            echo "已应用：ONNX 头文件改从 AAR 取（CJIME 原逻辑从 GitHub raw 下载，现已 404）"
          else
            echo "::warning::onnx-headers-from-aar.patch 不适用（CJIME 可能已自行修好），按原样构建"
          fi

      - name: Set up JDK 17
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        if: steps.skip.outputs.skip != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          NDK_VER=$(grep -oE 'ndkVersion[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts 2>/dev/null \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          NDK_VER=${NDK_VER:-29.0.14206865}
          echo "NDK 版本: $NDK_VER"
          sdkmanager "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Install build tools
        if: steps.skip.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            src/app/src/main/jni/onnxruntime
            src/app/src/main/jniLibs/**/libonnxruntime.so
          key: cj-native-${{ runner.os }}-${{ hashFiles('src/app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            cj-native-${{ runner.os }}-

      - name: Cache CMake build
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            src/app/.cxx
            src/app/src/main/jni/boost
            src/app/src/main/jni/boost-*.tar.xz
          key: cj-cmake-${{ runner.os }}-${{ hashFiles('src/app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cj-cmake-${{ runner.os }}-

      - name: Setup signing keystore
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::缺少 SIGNING_KEY 密钥，请先在仓库 Secrets 里配置"
            exit 1
          fi
          # build.gradle.kts 的 keyBase64 分支在配置阶段往 app/build 写文件，目录可能还不存在；
          # 先落成真实文件，走 storeFile 分支。
          printf '%s' "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/eta.jks"
          mkdir -p app/build
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/eta.jks" "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" \
            > app/keystore.properties
          ls -l "$GITHUB_WORKSPACE/eta.jks"

      - name: Download native deps (ONNX Runtime)
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew downloadOnnx --no-daemon

      - name: Build signed release APK
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          echo "=== 产物 ==="
          ls -l app/build/outputs/apk/release/

      - name: Verify and collect arm64 APK
        if: steps.skip.outputs.skip != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          rm -rf out && mkdir -p out
          shopt -s nullglob
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== 检查 $apk"
            # splits 关闭时输出文件名不带 ABI（…-universal.apk），所以按包内 lib/ 实际架构判定。
            ABIS=$(unzip -l "$apk" 'lib/*' | awk -F'lib/' '/lib\//{split($2,a,"/"); print a[1]}' | sort -u)
            echo "包内架构: $(echo "$ABIS" | tr '\n' ' ')"
            if [ "$(echo "$ABIS" | tr '\n' ',' )" != "arm64-v8a," ]; then
              echo "::warning::跳过非纯 arm64 的产物：$apk"
              continue
            fi
            "$APKSIGNER" verify --verbose --min-sdk-version 23 "$apk"
            cp "$apk" out/
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::没有找到纯 arm64-v8a 的 APK"
            ls -l app/build/outputs/apk/release/
            exit 1
          fi
          ls -l out/

      - name: Create release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: CJIME ${{ steps.ver.outputs.sha8 }}（模糊音锁定修复 · arm64）
          body: |
            基于 **onlyjco/CJIME**（CyIME 的下游 fork）commit `${{ steps.ver.outputs.ref }}` 构建，
            GPLv3，只改一处 native 逻辑，其余与上游一致。

            包名 **`com.onlyjco.cjime`**，与官方 CyIME（`com.cyletix.cyime`）**不冲突，可共存安装**。

            自动跟随：每天检查 onlyjco/CJIME 的 main 是否有新 commit，有就用同一补丁重建。

            ## 修的问题

            开了模糊音，点一下编码上的读音，模糊音的字就全没了。

            以 18 键小鹤双拼打 `jj` 为例（`jk` 键按两下）。这个码同时对应三个音节
            （jing / kan / kuai），而模糊音 `in/ing` 又让 `jin` 也落到 `jj` 上。
            实测这一个码下有 **123 个候选、四个读音**：

            | 读音 | 候选数 |
            |---|---|
            | jing | 49 |
            | jin | 43 |
            | kan | 18 |
            | kuai | 13 |

            第一屏：`看 金 快 经 进 块 精 惊 静 竟 近`，金在第 5 位。

            此时在编码上点 `jing`，候选变成：

            `经 精 惊 静 竟 景 敬 警 京 净 镜 境 晶 睛 井 竞 …`

            只剩那 49 个 jing，**另外 74 个（含金、今、斤、进、近、仅、紧、看、快、块、筷）被整批删掉**。

            ## 改动

            `app/src/main/jni/librime-t9/src/pinyin_syllable_selection.h` 的 `ConstrainGraph()`。

            原本锁定读音时把同一段编码上的其它读音边清空重建：

            ```cpp
            edge->second.clear();
            edge->second.emplace(syllable, chosen);
            ```

            改为：选中的读音保持原权重（排最前），同段其它的普通读音与模糊音读音保留并降权
            `credibility -= 1.0`；简拼 / 纠错类边（`type >= kAbbreviation`）仍然排除。

            没点读音时完全不受影响，候选与顺序与原版一致。

            ## 本地验证

            | | 段内读音数 | 内容 |
            |---|---|---|
            | 锁定前 | 4 | jing(+0.00) kan(+0.00) kuai(+0.00) jin(fuzzy, −0.69) |
            | 改前 | 1 | jing(+0.00) —— 金 丢失 |
            | 改后 | 4 | jing(+0.00) kan(−1.00) kuai(−1.00) jin(−1.69) |

            回归：同段只有 1 个读音时改前改后一致；同段有 abbreviation（简拼）时改后没有误留。
            另用 fan/fang、nan/lan、abc/xyz 三个无关场景验证过，逻辑里没有任何硬编码音节。

            ## 说明

            - 只出 **arm64-v8a** 一个包，其他架构不构建。
            - 签名是自建 keystore。因为包名不同（`com.onlyjco.cjime`），**不需要卸载官方 CyIME**，
              装上是另一个 App，官方版的数据和自建布局不受影响。
            - 新装的应用是全新数据目录，需要重新建一次 18 键布局：
              `q,we,rt,y,u,io,p / a,sd,fg,h,jk,l,_ / z,xc,v,bn,m`，
              双拼选小鹤，模糊音开 `in/ing`。
          files: src/out/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
