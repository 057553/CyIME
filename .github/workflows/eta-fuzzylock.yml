name: Eta fuzzy-lock fix build & release

# 只手动触发：验证「开模糊音后点读音，近音候选被整批删除」的修复。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag'
        required: true
        default: 'v1.15.105-fuzzylock'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::error::缺少 SIGNING_KEY 密钥，请先在仓库 Secrets 里配置"
            exit 1
          fi

      - name: Setup signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/eta18.jks"
          mkdir -p app/build
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/eta18.jks" \
            "${{ secrets.KEY_STORE_PASSWORD }}" \
            "${{ secrets.ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > app/keystore.properties
          ls -l "$GITHUB_WORKSPACE/eta18.jks"

      - name: Show patched function
        run: |
          sed -n '250,300p' app/src/main/jni/librime-t9/src/pinyin_syllable_selection.h

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -l app/build/outputs/apk/release/

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose --min-sdk-version 23 "$apk"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyime-fuzzylock-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: CyIME ${{ inputs.tag }}
          body: |
            基于 CyIME 1.15.105（GPLv3），仅改动一处：

            `app/src/main/jni/librime-t9/src/pinyin_syllable_selection.h` 的 `ConstrainGraph()`。

            原来的做法是：点选编码里的读音时，把同一段编码上的其它读音边整批清空。合并键布局下一个
            码本就对应多个音节（小鹤 18 键里 `jj` = jing / kan / kuai），模糊音又让 `jin` 落到 `jj` 上，
            于是点一下 `jing`，金 / 看 / 快这些字就全没了。

            改后：锁定只决定排序——选中的读音保持原权重排在前面，同段的其它普通读音和模糊音读音
            保留并降权（credibility −1.0），简拼 / 纠错类边仍然照旧排除。

            同段只有一个读音时（没开模糊音、也不是合并键碰撞）行为完全不变。
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
