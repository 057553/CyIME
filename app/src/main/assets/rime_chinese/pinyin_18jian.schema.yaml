# Rime schema
# 拼音 18 键：字母两两合并（we/rt/io、sd/fg/jk、xc/bn），与 26 键共享雾凇词库（rime_ice）。
# 键面见 xime.yaml 的 qwerty_18 段；点按合并键送组内第一个字母（代表字母），
# 词库拼音码由 speller/algebra 末尾的 derive 规则派生成代表字母序列，靠词库消歧（与九键同一思路）。

schema:
  schema_id: pinyin_18jian
  name: 中文18键
  version: "1.0"
  language: zh
  description: |
    拼音 18 键方案，字母两两合并（we/rt/io、sd/fg/jk、xc/bn），
    键宽更大误触更少，与九键同为词库消歧。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    reset: 0
    states: [ 无表情, 表情 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 简拼与容错规则（与 pinyin_simp / 26 键一致）
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 合并键：把组内另一个字母派生成代表字母（组与 xime.yaml qwerty_18 一一对应）。
    # 必须是最后几条：前面派生出来的编码同样要按合并键归一。
    - derive/[e]/w/
    - derive/[t]/r/
    - derive/[o]/i/
    - derive/[d]/s/
    - derive/[g]/f/
    - derive/[k]/j/
    - derive/[c]/x/
    - derive/[n]/b/

translator:
  dictionary: rime_ice
  prism: pinyin_18jian
  packs:
    - user_simp
  spelling_hints: 8
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

menu:
  page_size: 9

punctuator:
  import_preset: default
  __include: cyime_punctuator:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"

# 简／繁（设置 → 语言与方案 → 繁体输出）：与 26 键同一张台湾正体转换表。
traditionalize:
  option_name: traditionalization
  opencc_config: cyime_s2tw.json
  tips: none
  excluded_types: [user_table]

traditionalize_user:
  option_name: traditionalization
  opencc_config: cyime_s2tw_user.json
  tips: none
  excluded_types: [simplified]
